[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:cacheprovider: o diretorio .pytest_cache deste repositorio esta com
# permissoes travadas (nem o dono consegue escrever), e o aviso polui a saida.
addopts = "-ra --strict-markers -p no:cacheprovider"
markers = [
    "cenario: valida um dos tres cenarios obrigatorios do desafio",
]
filterwarnings = [
    "ignore::DeprecationWarning:streamlit.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conjunto pragmatico para a POC: erros reais, imports e simplificacoes obvias.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "E501",    # comprimento de linha fica a cargo do formatador
    "UP045",   # Optional[X] e usado deliberadamente nas assinaturas das tools
    "UP042",   # `str, Enum` e intencional: StrEnum muda a serializacao no Pydantic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # conftest precisa configurar env antes dos imports
