# Credenciais da UI Streamlit (POC).
#
# Este arquivo E versionado de proposito, e so por ser uma POC de avaliacao:
# sem ele ninguem consegue entrar na aplicacao depois de clonar o repositorio,
# porque tudo fica atras do login. Contem apenas hashes bcrypt de senhas de
# DEMONSTRACAO publicas, que nao protegem nada:
#
#   admin     -> admin123
#   corretor1 -> corretor123
