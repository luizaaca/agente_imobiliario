# Credenciais da UI Streamlit (POC).
#
# Este arquivo E versionado de proposito, e so por ser uma POC de avaliacao:
# sem ele ninguem consegue entrar na aplicacao depois de clonar o repositorio,
# porque tudo fica atras do login. Contem apenas hashes bcrypt de senhas de
# DEMONSTRACAO publicas, que nao protegem nada:
#
#   admin     -> admin123    (papel: admin)
#   corretor1 -> corretor123  (papel: corretor)
#
# O papel decide o que aparece no menu: o simulador de chat e o painel de custo
# de LLM sao so do admin. Isso e separacao de telas, nao fronteira de
# seguranca — quem edita este arquivo se da o papel que quiser.
#
# Em uso real, o caminho e outro: gere hashes novos, tire este arquivo do
# versionamento (`config/credentials.yaml` ja esta comentado no .gitignore) e
# entregue-o por fora, ou troque por um provedor de identidade de verdade.
#
# Para adicionar ou trocar uma senha: python -m scripts.generate_password_hash

credentials:
  usernames:
    admin:
      name: Administrador
      email: admin@exemplo.local
      roles: [admin]
      password: "$2b$12$bu/B8l/sN09eR4Kf06CR1OJIMlMY9yni3KFruqLJ78fcatjbTdydW"
    corretor1:
      name: Joao Silva
      email: corretor1@exemplo.local
      roles: [corretor]
      password: "$2b$12$B5BjvzfS9h3BApUj2gQLEulBuJRsZ2kOEKUKo5uYCbwxOrEphuoyq"

cookie:
  name: sdr_imobiliario_auth
  key: will_be_replaced_by_env_var
  expiry_days: 7
