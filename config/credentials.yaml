# Em uso real, o caminho e outro: gere hashes novos, tire este arquivo do
# versionamento (`config/credentials.yaml` ja esta comentado no .gitignore) e
# entregue-o por fora, ou troque por um provedor de identidade de verdade.
#
# Para adicionar ou trocar uma senha: python -m scripts.generate_password_hash

